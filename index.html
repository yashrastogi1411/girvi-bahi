<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>गिरवी बही</title>
<meta name="theme-color" content="#9E1B22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="गिरवी बही">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF7;--surface:#FFFFFF;--ink:#1E1B26;--muted:#6B6675;--line:#E6E2DA;
  --bahi:#9E1B22;--bahi-ink:#FFF6EC;--gold:#B8862B;--ok:#2F7D4F;--warn:#B45309;--danger:#B42318;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141218;--surface:#1D1A22;--ink:#EDEAF2;--muted:#A39DAE;--line:#2E2A35;
    --bahi:#8E1C22;--bahi-ink:#FFF1E2;--gold:#D9A845;--ok:#4CAF7A;--warn:#E0912F;--danger:#F0645A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141218;--surface:#1D1A22;--ink:#EDEAF2;--muted:#A39DAE;--line:#2E2A35;
  --bahi:#8E1C22;--bahi-ink:#FFF1E2;--gold:#D9A845;--ok:#4CAF7A;--warn:#E0912F;--danger:#F0645A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bahi)}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bahi);color:var(--bahi-ink);border-bottom:3px solid var(--gold)}
.hbar{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hbar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px;flex:1}
.hbar small{display:block;font-size:13px;font-weight:400;opacity:.85}
.hbtn{background:transparent;border:1px solid rgba(255,246,236,.45);color:var(--bahi-ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.summary div{background:var(--surface);padding:10px 12px}
.summary b{display:block;font-size:19px}
.summary span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.search{margin-bottom:12px}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.row.closed{border-left-color:var(--line);opacity:.75}
.row.risk{border-left-color:var(--danger)}
.rtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rtop strong{font-size:18px}
.rsub{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px}
.due{font-weight:700;font-size:18px}
.flag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.flag.warn{color:var(--warn)}.flag.danger{color:var(--danger)}.flag.ok{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bahi);color:var(--bahi-ink);border:2px solid var(--gold);border-radius:999px;padding:12px 20px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.bigdue{font-size:32px;font-weight:700;line-height:1.1}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary{background:var(--bahi);color:var(--bahi-ink);border-color:var(--bahi)}
.btn.wa{background:#1F8F4E;color:#fff;border-color:#1F8F4E}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.hint{font-size:14px;margin-top:6px}
.hint.warn{color:var(--warn)}.hint.danger{color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
td.r,th.r{text-align:right}
.back{background:none;border:none;color:inherit;font:inherit;font-size:22px;cursor:pointer;padding:0 6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:15px;z-index:20}
.sync{font-size:12px;opacity:.8}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:transform .08s}.row:active,.btn:active{transform:scale(.99)}}
.fld{display:flex;gap:6px;align-items:stretch}
.fld>input,.fld>textarea{flex:1;min-width:0}
.mic{flex:none;width:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink)}
.mic.on{background:var(--bahi);border-color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(184,134,43,.25)}}}
.search .fld input{margin:0}
.rates{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14px;color:var(--muted);margin:0 0 12px}
.rates.stale{color:var(--warn)}
.rates b{font-weight:600;width:100%}
.linkbtn{background:none;border:none;padding:0;font:inherit;font-size:14px;color:var(--bahi);text-decoration:underline;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .linkbtn{color:var(--gold)}}
:root[data-theme="dark"] .linkbtn{color:var(--gold)}
.itembox{min-width:0;border:1px solid var(--line);border-radius:10px;padding:4px 12px 12px;margin:14px 0 0}
.itembox legend{font-weight:600;padding:0 6px}
.tw{overflow-x:auto}
.home{background:none;border:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.pfx{flex:1;min-width:0;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.pfx span{padding:10px 0 10px 12px;color:var(--muted)}
.pfx input{border:none;border-radius:0;padding-left:6px;min-width:0}
.pfx:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.pfx input:focus{outline:none}
.cam{cursor:pointer;margin:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.th{position:relative;display:inline-block}
.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.th button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;line-height:1;cursor:pointer}
.sigpad{display:block;width:100%;height:170px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:80%;border-radius:8px;background:#fff}
.lock{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.lock[hidden]{display:none}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockname{font-weight:700;font-size:22px;color:var(--bahi);border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:2px;margin-bottom:8px}
.lockbox h2{font-size:19px;font-weight:600;margin:8px 0 14px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dot.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.key{font:inherit;font-size:26px;font-weight:600;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.key:active{background:var(--line)}
.code{font-size:26px;font-weight:700;letter-spacing:2px;background:var(--surface);border:2px dashed var(--gold);border-radius:12px;padding:12px;margin:8px 0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px}
.chk input{width:auto}
.mark{color:var(--danger);font-size:.8em}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px;background:var(--surface)}
.seg button{font:inherit;font-size:17px;font-weight:600;padding:10px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--bahi);color:var(--bahi-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:14px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.bargain{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 0}
.bargain:empty{display:none}
.bargain div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surface);padding:10px 12px}
.bargain span{color:var(--muted);font-size:15px}
.bargain b{font-size:19px}
.bargain b.ok{color:var(--ok)}
.bargain .limit{background:var(--bahi);}
.bargain .limit span,.bargain .limit b{color:var(--bahi-ink)}
.bargain .limit b{font-size:24px}
dd.neg{color:var(--danger)}
.bargain .big b{font-size:22px}
.billrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.billrow:last-child{border-bottom:none}
.billrow .r{text-align:right}
.invoice{background:#fff;color:#111;border:1px solid #ddd;border-radius:10px;padding:16px;font-size:14px}
.invoice table{font-size:13px}
@media print{.invoice .tw{overflow:visible}.invoice table{font-size:11px}}
.invoice td,.invoice th{border-color:#ddd;color:#111}
.invoice .kv dt{color:#555}
.invoice .muted{color:#555}
.ih{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #9E1B22;padding-bottom:8px;margin-bottom:8px}
.ih h2{margin:0;font-size:20px;color:#9E1B22}
.ih .r{text-align:right}
.if{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:36px;font-size:13px}
.sigline{border-top:1px solid #111;padding-top:4px}
@media print{
  header,.fab,.noprint,#toast,#lock,body::before{display:none!important}
  :root{padding:0}
  body{background:#fff}
  main{max-width:none;padding:0}
  .invoice{border:none;padding:0}
}
</style>
</head>

// Phone storage (IndexedDB). Only "meta" (language + locked keys) is readable without the PIN;
// the register itself ("vault") and every photo are stored scrambled with the PIN-protected key.
const IDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("girvi-bahi", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => { const t = db.transaction("kv", mode); const req = fn(t.objectStore("kv")); t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error); });
  };
  return { get: k => tx("readonly", s => s.get(k)), set: (k, v) => tx("readwrite", s => s.put(v, k)), del: k => tx("readwrite", s => s.delete(k)), keys: () => tx("readonly", s => s.getAllKeys()) };
})();
async function loadLocal() {
  try { const m = await IDB.get("meta"); if (m) S.settings = { ...S.settings, lang: m.lang || "hi", lock: m.lock }; } catch (e) {}
}
let saveTimer = null;
function saveLocal() { clearTimeout(saveTimer); saveTimer = setTimeout(writeVault, 250); }
async function writeVault() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!dataKey) return;
  const { lock, ...settings } = S.settings;
  const box = await seal(dataKey, new TextEncoder().encode(JSON.stringify({ settings, pledges: S.pledges, buys: S.buys, sales: S.sales })));
  const prev = await IDB.get("vault");
  if (prev) await IDB.set("vault_prev", prev);
  await IDB.set("vault", box);
  await IDB.set("meta", { lang: S.settings.lang, lock: S.settings.lock });
}
async function openVault() {
  let box = await IDB.get("vault"), d = null;
  try { if (box) d = JSON.parse(new TextDecoder().decode(await unseal(dataKey, box))); }
  catch (e) { box = await IDB.get("vault_prev"); if (box) d = JSON.parse(new TextDecoder().decode(await unseal(dataKey, box))); }
  if (d) { S.settings = { ...DEFAULT_SETTINGS, ...d.settings, lock: S.settings.lock, lang: S.settings.lang || d.settings.lang }; S.pledges = normalizeAll(d.pledges); S.buys = d.buys || {}; S.sales = d.sales || {}; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
function queueWrite(id, fn) {
  writeQ[id] = (writeQ[id] || Promise.resolve()).then(fn).catch(err => toast(err && err.code === "quota_exceeded" ? t("storageFull") : t("notSaved")));
}
// Older entries had one "item"; now a girvi holds a list of items (gold and silver can be mixed).
// Gold purity is in karat, silver purity in percent ("touch").
function normalize(p) {
  if (!p || p.items) return p;
  const q = { ...p };
  q.items = p.item ? [{ desc: p.item.desc, metal: p.item.metal, purity: p.item.metal === "silver" ? 100 : Number(p.item.karat) || 22, grossWt: p.item.grossWt, netWt: p.item.netWt }] : [];
  delete q.item;

}
function normalizeAll(obj) { const o = {}; Object.values(obj || {}).forEach(p => { const n = normalize(p); if (n && n.id) o[n.id] = n; }); return o; }
function persistPledge(p) { S.pledges[p.id] = p; saveLocal(); if (col) queueWrite(p.id, () => col.doc(p.id).set(p)); }
function removePledge(id) { const old = S.pledges[id]; delete S.pledges[id]; saveLocal(); dropPhotos(old); if (col) queueWrite(id, () => col.doc(id).delete()); }
function persistSettings() { saveLocal(); if (col) queueWrite("settings", () => col.doc("settings").set(S.settings)); }

async function connectCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user, dl, as] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads"), claude.use("assets")]);
    downloads = dl; assets = as;
    if (!db || !user) { render(); return; }
    const uid = await user.id();
    if (!uid) { render(); return; }
    const c = db.collection("data/users/" + uid);
    const first = await c.get();
    if (first.empty && Object.keys(S.pledges).length) {
      await c.doc("settings").set(S.settings);
      for (const p of Object.values(S.pledges)) await c.doc(p.id).set(p);
    }
    col = c; S.mode = "cloud";
    col.onSnapshot(snap => {
      const pl = {}; let st = null;
      snap.docs.forEach(d => { const v = d.data(); if (d.id === "settings") st = v; else if (v && v.kind === "pledge") pl[d.id] = normalize(v); });
      S.pledges = pl; if (st) S.settings = { ...DEFAULT_SETTINGS, ...st };
      saveLocal();
      if (S.view.name === "list" || S.view.name === "detail") render(); else renderHeader();
    }, () => { S.mode = "local"; col = null; renderHeader(); });
  } catch (e) { render(); }
}

// ---------- Dates & money ----------
const pad = n => String(n).padStart(2, "0");
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addMonths(dt, n) { const y = dt.getFullYear(), m = dt.getMonth() + n, day = dt.getDate(); return new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate())); }
function span(fromS, toS) {
  const a = parseD(fromS), b = parseD(toS);
  if (b <= a) return { months: 0, days: 0, total: 0 };
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (addMonths(a, m) > b) m--;
  return { months: m, days: Math.round((b - addMonths(a, m)) / 86400000), total: Math.round((b - a) / 86400000) };
}
function chargeMonths(fromS, toS, method) {
  const { months, days } = span(fromS, toS);
  if (method === "day") return months + days / 30;
  if (method === "half") return months + (days === 0 ? 0 : days <= 15 ? 0.5 : 1);
  return months + (days > 0 ? 1 : 0);
}
const inr = n => "₹" + Math.round(n || 0).toLocaleString("en-IN");
const fmtD = (s, l = lang()) => parseD(s).toLocaleDateString(l === "hi" ? "hi-IN" : "en-IN", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Interest-first: each payment clears interest due so far, the rest cuts principal. No compounding.
function compute(p, asOf = todayISO()) {
  let principal = p.principal, start = p.startDate, carry = 0, interestPaid = 0, principalPaid = 0;
  const pays = [...(p.payments || [])].sort((x, y) => x.date.localeCompare(y.date));
  for (const pay of pays) {
    const acc = carry + principal * (p.rate / 100) * chargeMonths(start, pay.date, p.method);
    if (pay.amount >= acc) { interestPaid += acc; const cut = Math.min(principal, pay.amount - acc); principal -= cut; principalPaid += cut; carry = 0; }
    else { interestPaid += pay.amount; carry = acc - pay.amount; }
    start = pay.date;
  }
  const end = p.status === "closed" ? (p.closedDate || asOf) : asOf;
  const interest = p.status === "closed" ? 0 : carry + principal * (p.rate / 100) * chargeMonths(start, end, p.method);
  const valueNow = pledgeValue(p), due = principal + interest;
  return { principal, interest, due, interestPaid, principalPaid, age: span(p.startDate, asOf), valueNow, ltvNow: valueNow ? due / valueNow : null };
}
function itemValue(it) {
  if (!it || !it.netWt) return 0;
  if (it.metal === "silver") return it.netWt * S.settings.silver * (Number(it.purity) || 0) / 100;
  return it.netWt * S.settings.gold24 * (Number(it.purity) || 0) / 24;
}
const pledgeValue = p => (p.items || []).reduce((s, it) => s + itemValue(it), 0);
const descs = p => (p.items || []).map(i => i.desc).filter(Boolean).join(", ");
const purityLabel = it => it.metal === "silver" ? `${it.purity}%` : `${it.purity}K`;
const metalLabel = (it, L) => (it.metal === "silver" ? (L === "en" ? "Silver" : "चाँदी") : (L === "en" ? "Gold" : "सोना")) + " " + purityLabel(it);
function ratesStale() { return !S.settings.ratesDate || span(S.settings.ratesDate, todayISO()).total > 2; }
function flags(p, c) {
  if (p.status === "closed") return [[t("fClosed"), "ok"]];
  const f = [];
  if (c.ltvNow && c.ltvNow >= 0.9) f.push([t("fDanger"), "danger"]);
  else if (c.ltvNow && c.ltvNow >= 0.75) f.push([t("fWatch"), "warn"]);
  if (c.age.months >= S.settings.overdueMonths) f.push([t("fMonths", c.age.months), "warn"]);
  return f;
}

// ---------- Voice input (Web Speech API; falls back to the keyboard's own mic) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null;
function mic(id, kind = "text") {
  if (!SR) return "";
  return `<button type="button" class="mic" aria-label="${t("speak")}" title="${t("speak")}" onclick="listen('${id}','${kind}',this)">🎤</button>`;
}
function field(id, inputHtml, kind) { return `<div class="fld">${inputHtml}${mic(id, kind)}</div>`; }
function spokenNumber(text) {
  const s = text.replace(/[०-९]/g, d => "०१२३४५६७८९".indexOf(d)).replace(/,/g, "").toLowerCase();
  const m = s.match(/(\d+(?:\.\d+)?)\s*(हज़ार|हजार|hazaar|hazar|thousand|लाख|lakh|lac|k)?/);
  if (!m) return null;
  let n = parseFloat(m[1]);
  if (m[2]) n *= /लाख|lakh|lac/.test(m[2]) ? 100000 : 1000;
  return n;
}
function listen(id, kind, btn) {
  if (activeRec) { activeRec.abort(); activeRec = null; return; }
  const el = document.getElementById(id);
  const rec = new SR();
  rec.lang = lang() === "hi" ? "hi-IN" : "en-IN"; rec.interimResults = false; rec.maxAlternatives = 1;
  activeRec = rec; btn.classList.add("on"); btn.setAttribute("aria-label", t("listening"));
  toast(t("listening"));
  rec.onresult = e => {
    const said = e.results[0][0].transcript.trim();
    if (kind === "phone") {
      const d = phone10(said.replace(/[०-९]/g, x => "०१२३४५६७८९".indexOf(x)));
      if (d.length < 10) return toast(t("noNumber"));
      el.value = d;
    } else if (kind === "num") {
      const n = spokenNumber(said);
      if (n == null) return toast(t("noNumber"));
      el.value = n;
    } else el.value = el.tagName === "TEXTAREA" && el.value ? el.value + " " + said : said;
    el.dispatchEvent(new Event("input", { bubbles: true }));
  };
  rec.onerror = e => toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? t("micBlocked") : t("noSpeech"));
  rec.onend = () => { activeRec = null; btn.classList.remove("on"); btn.setAttribute("aria-label", t("speak")); };
  try { rec.start(); } catch (e) { activeRec = null; btn.classList.remove("on"); toast(t("micBlocked")); }
}

  cv.width = w * r; cv.height = h * r;
  const x = cv.getContext("2d"); x.scale(r, r); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
  x.strokeStyle = "#1B2A8F"; x.lineWidth = 2.6; x.lineCap = "round"; x.lineJoin = "round";

  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + 0.1, b + 0.1); x.stroke(); pads[key].dirty = true; };
  cv.onpointermove = e => { if (!drawing) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };

// ---------- PIN lock & private notes ----------
// A random key locks private notes. That key is itself locked twice: by the PIN and by a
// recovery code the shopkeeper writes on paper. Only scrambled data is ever stored.
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function kdf(secret, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, bytes) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes)) }; }
async function unseal(key, box) { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct))); }
async function wrapWith(secret, raw) { const salt = crypto.getRandomValues(new Uint8Array(16)); return { salt: b64(salt), ...(await seal(await kdf(secret, salt), raw)) }; }
async function unwrapWith(secret, w) { return unseal(await kdf(secret, unb64(w.salt)), w); }
const importDK = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
const normCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
function newRecoveryCode() { const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; return [...crypto.getRandomValues(new Uint8Array(12))].map(x => A[x % A.length]).join("").replace(/(.{4})(?!$)/g, "$1-"); }
let dataKey = null, PF = null, lastActive = Date.now(), hiddenAt = null;
const isLocked = () => !!S.settings.lock && !dataKey;
const encryptNote = async text => seal(dataKey, new TextEncoder().encode(text));
const decryptNote = async box => new TextDecoder().decode(await unseal(dataKey, box));
async function saveLock(pin, raw, codes) {
  const lock = { pin: await wrapWith(pin, raw), rec: codes ? await Promise.all(codes.map(c => wrapWith(normCode(c), raw))) : S.settings.lock.rec };
  S.settings = { ...S.settings, lock }; dataKey = await importDK(raw);
  await IDB.set("meta", { lang: S.settings.lang, lock });
  persistSettings();
}
const recList = lock => Array.isArray(lock.rec) ? lock.rec : [lock.rec];
async function unwrapAny(code, lock) {
  for (const r of recList(lock)) { try { return await unwrapWith(normCode(code), r); } catch (e) { /* try the next code */ } }
  throw new Error("bad code");
}
async function lockNow() {
  if (!S.settings.lock || !dataKey) return;
  try { await writeVault(); } catch (e) {}
  Object.values(urlCache).forEach(u => URL.revokeObjectURL(u)); urlCache = {};
  dataKey = null; S.pledges = {}; S.buys = {}; S.sales = {}; PF = { mode: "unlock", buf: "" }; document.querySelectorAll(".lb").forEach(x => x.remove()); render(); }

function startChangePin() { PF = { mode: "old", buf: "" }; drawPad(); }
function endFlow() { PF = !S.settings.lock ? { mode: "welcome" } : isLocked() ? { mode: "unlock", buf: "" } : null; drawPad(); }
function padTitle() {

      : PF.mode === "restore" ? `<button class="linkbtn" onclick="PF={mode:'restorecode'};drawPad()">${t("useCodeInstead")}</button> · <button class="linkbtn" onclick="cancelRestore()">${t("cancelPin")}</button>`
      : `<button class="linkbtn" onclick="endFlow()">${t("cancelPin")}</button>`}</div>`;
}
async function padKey(k) {
  if (PF.busy) return;
  if (PF.until && Date.now() < PF.until) { PF.msg = t("waitPin", Math.ceil((PF.until - Date.now()) / 1000)); return drawPad(); }
  PF.msg = "";
  if (k === "⌫") { PF.buf = PF.buf.slice(0, -1); return drawPad(); }
  if (PF.buf.length >= 4) return;
  PF.buf += k; drawPad();
  if (PF.buf.length < 4) return;
  const pin = PF.buf; PF.busy = true;
  try {
    if (PF.mode === "unlock") {
      try { dataKey = await importDK(await unwrapWith(pin, S.settings.lock.pin)); await openVault(); PF = null; drawPad(); lastActive = Date.now(); render(); return; }
      catch (e) { PF.fails = (PF.fails || 0) + 1; PF.buf = ""; PF.msg = t("wrongPin"); if (PF.fails % 5 === 0) PF.until = Date.now() + 30000 * (PF.fails / 5); }
    } else if (PF.mode === "restore") {
      try { return await finishRestore(await unwrapWith(pin, pendingRestore.lock.pin)); }
      catch (e) { PF.buf = ""; PF.msg = t("wrongPin"); }
    } else if (PF.mode === "old") {
      try { PF = { mode: "set1", buf: "", raw: await unwrapWith(pin, S.settings.lock.pin) }; }
      catch (e) { PF.buf = ""; PF.msg = t("wrongPin"); }
    } else if (PF.mode === "set1") { PF = { ...PF, mode: "set2", first: pin, buf: "" }; }
    else if (PF.mode === "set2") {
      if (pin !== PF.first) { PF = { ...PF, mode: "set1", buf: "", msg: t("pinMismatch") }; }
      else if (PF.fresh) { const codes = [newRecoveryCode(), newRecoveryCode()]; await saveLock(pin, PF.raw, codes); await writeVault(); PF = { mode: "showcode", codes }; }
      else { const rec = PF.recovering; await saveLock(pin, PF.raw); if (rec) await openVault(); PF = null; toast(t("pinChanged")); if (rec) render(); else afterPinSet(); }
    }
  } finally { if (PF) PF.busy = false; }
  drawPad();
}
async function tryRecover() {

// When the app runs on its own website, point this at a small rates endpoint that returns

function listData() {
  const all = Object.values(S.pledges).map(p => ({ p, c: compute(p) }));
  const tab = S.view.tab, q = S.view.q.trim().toLowerCase();
  let rows = all.filter(x => tab === "closed" ? x.p.status === "closed" : tab === "attention" ? x.p.status !== "closed" && flags(x.p, x.c).length : x.p.status !== "closed");
  if (q) rows = rows.filter(x => [x.p.customer.name, x.p.customer.phone, x.p.customer.village, descs(x.p), String(x.p.no)].join(" ").toLowerCase().includes(q));
  rows.sort((a, b) => b.p.startDate.localeCompare(a.p.startDate) || b.p.no - a.p.no);
  return { all, rows };
}

// ---------- Selling new jewellery: market price → discount → GST → old gold → pay ----------
const r2 = n => Math.round(n * 100) / 100;
const saleBlank = (metal = "gold") => ({ desc: "", metal, purity: metal === "silver" ? 92.5 : 22, netWt: null, makingPct: metal === "silver" ? S.settings.makingS : S.settings.makingG, other: 0 });
function lineAmount(it) {
  const metal = itemValue(it), making = metal * (Number(it.makingPct) || 0) / 100, other = Number(it.other) || 0;
  return { metal: r2(metal), making: r2(making), other, amount: r2(metal + making + other), ratePerG: it.netWt ? r2(metal / it.netWt) : 0 };
}
const oldVal = it => itemValue(it) * (1 - (it.metal === "silver" ? S.settings.exchDedS : S.settings.exchDedG) / 100);
// Works out one bill. Discount and old items are split across items by value when bills are separate.
function billMath(lines, discount, oldAmt) {
  const st = S.settings, gstOn = st.gstMode === "regular", rate = gstOn ? Number(st.gstRate) || 0 : 0;
  const subtotal = r2(lines.reduce((s, l) => s + l.amount, 0));
  const disc = Math.min(Math.max(0, discount || 0), subtotal), taxable = r2(subtotal - disc);
  const base = st.gstOn === "net" ? Math.max(0, taxable - oldAmt) : taxable;
  const gst = r2(base * rate / 100), total = r2(taxable + gst), raw = total - oldAmt, pay = Math.round(raw);
  return { subtotal, disc, taxable, rate, gst, total, old: oldAmt, round: r2(pay - raw), pay };
}
function splitBills(lines, discount, oldAmt, split) {
  if (!split || lines.length < 2) return [{ idx: lines.map((_, i) => i), ...billMath(lines, discount, oldAmt) }];
  const sub = lines.reduce((s, l) => s + l.amount, 0) || 1;
  let dLeft = discount, oLeft = oldAmt;
  return lines.map((l, i) => {
    const last = i === lines.length - 1, share = l.amount / sub;
    const d = last ? dLeft : Math.round(discount * share), o = last ? oLeft : Math.round(oldAmt * share);
    dLeft -= d; oLeft -= o;
    return { idx: [i], ...billMath([l], d, o) };
  });
}

function nextBillNos(count) {
  const d = new Date(), fy = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1, prefix = `${fy}-${String(fy + 1).slice(2)}/`;
  const used = Object.values(S.sales).flatMap(x => x.bills.map(b => b.no)).filter(n => n.startsWith(prefix)).map(n => Number(n.split("/")[1]) || 0);
  let next = Math.max(0, ...used) + 1;
  return Array.from({ length: count }, () => prefix + String(next++).padStart(4, "0"));
}
async function saveSale() {

  const keep = st.items.map((it, i) => (it.desc || it.netWt) ? i : -1).filter(i => i >= 0);
  if (!keep.length) return toast(t("describeItem"));
  const bad = keep.find(i => !st.items[i].desc || !st.items[i].netWt || !st.items[i].purity);
  if (bad !== undefined) return toast(t("itemIncomplete", bad + 1));
  const oldBad = readOld().findIndex(it => !it.desc || !it.netWt || !it.purity);
  if (oldBad >= 0) return toast(t("itemIncomplete", oldBad + 1));
  const mode = f_mode.value, pan = (f_pan.value || "").toUpperCase().trim();
  if (st.all.pay >= 200000 && mode === "cash") return toast(t("cashBan"));
  if (st.all.total >= 200000 && !/^[A-Z]{5}\d{4}[A-Z]$/.test(pan)) return toast(t("needPan"));
  const items = keep.map(i => ({ ...st.items[i], ...st.lines[i] })), lines = keep.map(i => st.lines[i]);
  const bills = splitBills(lines, st.disc, st.oldAmt, st.split), nos = nextBillNos(bills.length);
  bills.forEach((b, i) => { b.no = nos[i]; });
  const x = {
    kind: "sale", id: "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: todayISO(), createdAt: new Date().toISOString(),
    customer: { name, phone, village: f_vill.value.trim(), pan: st.all.total >= 200000 ? pan : "" },
    items, old: oldItems.map(it => ({ ...it, value: Math.round(oldVal(it)) })), oldAgreed: st.oldAmt, discount: st.disc, mode, bills,
    gst: { mode: S.settings.gstMode, rate: S.settings.gstRate, on: S.settings.gstOn, gstin: S.settings.gstin },

const num = (v, d) => (v === "" || isNaN(Number(v)) ? d : Math.max(0, Math.min(60, Number(v))));
function saveSettings() {
  const g = Number(s_g.value) / 10 || S.settings.gold24, sv = Number(s_s.value) / 1000 || S.settings.silver;
  const changed = Math.round(g * 10) !== Math.round(S.settings.gold24 * 10) || Math.round(sv * 1000) !== Math.round(S.settings.silver * 1000);
  S.settings = { ...S.settings,
    lang: s_lang.value, receiptLang: s_rl.value, shopName: s_shop.value.trim() || DEFAULT_SETTINGS.shopName,
    gold24: g, silver: sv, ratesDate: changed ? todayISO() : (S.settings.ratesDate || todayISO()),
    rate: Number(s_r.value) || S.settings.rate, overdueMonths: Number(s_o.value) || 6, method: s_m.value,
    buyOfferG: num(s_og.value, 8), buyMinG: num(s_mg.value, 4), buyOfferS: num(s_os.value, 15), buyMinS: num(s_ms.value, 8),
    gstMode: s_gm.value, gstRate: num(s_gr.value, 3), gstOn: s_go.value, gstin: s_gstin.value.trim().toUpperCase(), shopAddress: s_addr.value.trim(),
    makingG: num(s_mkg.value, 12), makingS: num(s_mks.value, 10), exchDedG: num(s_exg.value, 2), exchDedS: num(s_exs.value, 5), maxDisc: num(s_md.value, 5),
  };
  // The limit can never be a better deal for the customer than the opening offer
  if (S.settings.buyMinG > S.settings.buyOfferG) S.settings.buyMinG = S.settings.buyOfferG;
  if (S.settings.buyMinS > S.settings.buyOfferS) S.settings.buyMinS = S.settings.buyOfferS;
  persistSettings(); toast(t("settingsSaved")); go({ name: "list" });
}
async function exportData() {
  await writeVault();
  const photos = {};
  for (const k of await IDB.keys()) if (String(k).startsWith("ph:")) photos[k] = await IDB.get(k);
  const payload = { app: "girvi-bahi", version: 2, enc: true, exportedAt: new Date().toISOString(), lock: S.settings.lock, vault: await IDB.get("vault"), photos };
  const file = new File([JSON.stringify(payload)], `girvi-backup-${todayISO()}.json`, { type: "application/json" });
  const done = () => { S.settings = { ...S.settings, lastBackup: todayISO() }; saveLocal(); toast(t("backupSaved")); if (S.view.name === "list") render(); };
  extAct();
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: t("appName") }); return done(); }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000); done();
}
let pendingRestore = null;
async function importData(file) {
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); if (d.app !== "girvi-bahi" || !d.enc || !d.lock || !d.vault) throw new Error(); }
  catch (e) { return toast(t("badFile")); }
  if (dataKey && Object.keys(S.pledges).length && !confirm(t("replaceAll"))) return;
  pendingRestore = d; PF = { mode: "restore", buf: "" }; drawPad();
}
function cancelRestore() { pendingRestore = null; endFlow(); }
async function restoreWithCode() {
  try { await finishRestore(await unwrapAny(document.getElementById("rc").value, pendingRestore.lock)); }
  catch (e) { PF.msg = t("badRecovery"); drawPad(); }
}
async function finishRestore(raw) {
  const d = pendingRestore;
  dataKey = await importDK(raw);
  for (const k of await IDB.keys()) if (String(k).startsWith("ph:")) await IDB.del(k);
  for (const [k, v] of Object.entries(d.photos || {})) await IDB.set(k, v);
  await IDB.set("vault", d.vault);
  S.settings = { ...S.settings, lock: d.lock };
  await IDB.set("meta", { lang: S.settings.lang, lock: d.lock });
  await openVault();
  pendingRestore = null; PF = null; drawPad();
  S.view = { name: "list", tab: "active", q: "" }; render(); toast(t("restored"));
}
